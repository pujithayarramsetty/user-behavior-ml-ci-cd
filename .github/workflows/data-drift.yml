
name: Data Drift Detection

on:
  workflow_dispatch:
  push:
    paths:
      - "drift/**"
      - "user_behavior_dataset.csv"
      - ".github/workflows/data-drift.yml"

jobs:
  detect-drift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn joblib

      - name: Prepare reference data
        run: python drift/prepare_reference.py

      - name: Test no-drift case
        run: |
          python drift/simulate_current_data.py --mode stable
          python drift/detect_drift.py

      - name: Test drift case
        run: |
          python drift/simulate_current_data.py --mode drift
          python drift/detect_drift.py

      - name: Retrain candidate model
        run: python drift/retrain_candidate.py

      - name: Check candidate quality
        run: |
          python -c "import json; m=json.load(open('drift/candidate_metrics.json')); print(json.dumps(m, indent=2)); assert m['passes_quality_gate'], 'Candidate failed quality gate'"
