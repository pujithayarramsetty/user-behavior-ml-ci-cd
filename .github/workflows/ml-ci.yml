
name: User Behavior ML CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  train-test-containerize:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Upgrade pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # 4. Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 5. Train the model
      - name: Train User Behavior Model
        run: python train_model.py

      # 6. Check model quality
      - name: Check ML Quality Gate
        run: python quality_gate.py

      # 7. Verify model artifacts
      - name: Verify model artifacts
        run: |
          ls -lh *.pkl
          test -f user_behavior_model.pkl
          test -f label_encoders.pkl
          echo "Model artifacts verified."

      # 8. Run automated tests
      - name: Run Automated Tests
        run: python -m unittest discover -v

      # 9. Build Docker image
      - name: Build Docker image
        run: docker build -t user-behavior-ml:${{ github.sha }} .

      # 10. Start test container
      - name: Start Docker container
        run: |
          docker run -d \
            --name user-behavior-container \
            -p 5000:5000 \
            user-behavior-ml:${{ github.sha }}

      # 11. Test application health
      - name: Test application health
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Application is healthy."
              exit 0
            fi
            sleep 2
          done
          docker logs user-behavior-container
          exit 1

      # 12. Test prediction endpoint
      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "Device Model": "Google Pixel 5",
              "Operating System": "Android",
              "App Usage Time (min/day)": 393,
              "Screen On Time (hours/day)": 6.4,
              "Battery Drain (mAh/day)": 1872,
              "Number of Apps Installed": 67,
              "Data Usage (MB/day)": 1122,
              "Age": 40,
              "Gender": "Male"
            }' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'

      # 13. Display test container logs
      - name: Show Docker logs
        if: always()
        run: docker logs user-behavior-container || true

      # 14. Remove test container
      - name: Remove Docker container
        if: always()
        run: docker rm -f user-behavior-container || true

      # 15. Login to GHCR
      - name: Login to GHCR
        if: success() && github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      # 16. Tag Docker images
      - name: Tag Docker images
        if: success() && github.event_name != 'pull_request'
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker tag user-behavior-ml:${{ github.sha }} ghcr.io/${IMAGE_NAME}:v1
          docker tag user-behavior-ml:${{ github.sha }} ghcr.io/${IMAGE_NAME}:latest

      # 17. Publish versioned image
      - name: Push versioned image
        if: success() && github.event_name != 'pull_request'
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker push ghcr.io/${IMAGE_NAME}:v1

      # 18. Publish latest image
      - name: Push latest image
        if: success() && github.event_name != 'pull_request'
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker push ghcr.io/${IMAGE_NAME}:latest

      # 19. Pull published image
      - name: Pull published image
        if: success() && github.event_name != 'pull_request'
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker pull ghcr.io/${IMAGE_NAME}:latest

      # 20. Verify published image
      - name: Verify published image
        if: success() && github.event_name != 'pull_request'
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker image inspect ghcr.io/${IMAGE_NAME}:latest

      # 21. Start published container
      - name: Run published container
        if: success() && github.event_name != 'pull_request'
        run: |
          docker run -d \
            --name published-user-behavior-container \
            -p 5001:5000 \
            ghcr.io/pujithayarramsetty/user-behavior-ml-ci-cd:latest

      # 22. Test published container health
      - name: Test published container health
        if: success() && github.event_name != 'pull_request'
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5001/health; then
              echo "Published image is healthy."
              exit 0
            fi
            sleep 2
          done
          docker logs published-user-behavior-container
          exit 1

      # 23. Test prediction from published image
      - name: Test published image prediction
        if: success() && github.event_name != 'pull_request'
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "Device Model": "Google Pixel 5",
              "Operating System": "Android",
              "App Usage Time (min/day)": 393,
              "Screen On Time (hours/day)": 6.4,
              "Battery Drain (mAh/day)": 1872,
              "Number of Apps Installed": 67,
              "Data Usage (MB/day)": 1122,
              "Age": 40,
              "Gender": "Male"
            }' \
            http://localhost:5001/predict)

          echo "Published image prediction: $response"
          echo "$response" | grep -q '"prediction"'

      # 24. Remove published container
      - name: Remove published container
        if: always()
        run: docker rm -f published-user-behavior-container || true

  # Practical 14: Kubernetes deployment
  deploy-kubernetes:
    needs: train-test-containerize
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, X64]

    steps:
      # 25. Verify runner and Kubernetes access
      - name: Verify Kubernetes access
        shell: powershell
        run: |
          docker --version
          kubectl config current-context
          kubectl get nodes
          kubectl get deployments
          kubectl get services

      # 26. Deploy the published image
      - name: Deploy User Behavior API
        shell: powershell
        run: |
          kubectl set image deployment/user-behavior-api user-behavior-api=ghcr.io/pujithayarramsetty/user-behavior-ml-ci-cd:latest
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to update the Kubernetes image."
          }

          kubectl rollout status deployment/user-behavior-api --timeout=180s
          if ($LASTEXITCODE -ne 0) {
            throw "Kubernetes rollout failed."
          }

      # 27. Verify deployment and replicas
      - name: Verify Kubernetes deployment
        shell: powershell
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services

          $deployment = kubectl get deployment user-behavior-api -o json | ConvertFrom-Json
          if ($deployment.status.readyReplicas -ne 3) {
            throw "Expected three ready replicas."
          }

      # 28. Test Kubernetes health endpoint
      - name: Test Kubernetes API health
        shell: powershell
        run: |
          $portForward = Start-Process kubectl `
            -ArgumentList "port-forward service/user-behavior-service 5002:5000" `
            -PassThru -WindowStyle Hidden

          try {
            $healthy = $false

            for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Seconds 2

              try {
                $response = Invoke-RestMethod `
                  -Uri "http://127.0.0.1:5002/health" `
                  -TimeoutSec 3

                if ($response.status -eq "healthy") {
                  $healthy = $true
                  Write-Host "Kubernetes health check passed."
                  break
                }
              } catch {
                Write-Host "Waiting for Kubernetes API..."
              }
            }

            if (-not $healthy) {
              kubectl get pods
              throw "Kubernetes health check failed."
            }
          }
          finally {
            Stop-Process -Id $portForward.Id -Force -ErrorAction SilentlyContinue
          }

      # 29. Test Kubernetes prediction endpoint
      - name: Test Kubernetes prediction
        shell: powershell
        run: |
          $portForward = Start-Process kubectl `
            -ArgumentList "port-forward service/user-behavior-service 5002:5000" `
            -PassThru -WindowStyle Hidden

          try {
            $connected = $false

            for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Seconds 2
              try {
                $health = Invoke-RestMethod `
                  -Uri "http://127.0.0.1:5002/health" `
                  -TimeoutSec 3
                $connected = $true
                break
              } catch {
                Write-Host "Waiting for port forwarding..."
              }
            }

            if (-not $connected) {
              throw "Could not connect to the Kubernetes service."
            }

            $body = @{
              "Device Model" = "Google Pixel 5"
              "Operating System" = "Android"
              "App Usage Time (min/day)" = 393
              "Screen On Time (hours/day)" = 6.4
              "Battery Drain (mAh/day)" = 1872
              "Number of Apps Installed" = 67
              "Data Usage (MB/day)" = 1122
              "Age" = 40
              "Gender" = "Male"
            } | ConvertTo-Json

            $response = Invoke-RestMethod `
              -Uri "http://127.0.0.1:5002/predict" `
              -Method Post `
              -ContentType "application/json" `
              -Body $body

            $response | ConvertTo-Json -Depth 10
            Write-Host "Kubernetes prediction test completed."
          }
          finally {
            Stop-Process -Id $portForward.Id -Force -ErrorAction SilentlyContinue
          }

      # 30. Display rollout history and final status
      - name: Show Kubernetes rollout history
        if: always()
        shell: powershell
        run: |
          kubectl rollout history deployment/user-behavior-api
          kubectl get deployments
          kubectl get pods
          kubectl get services
