name: User Behavior ML CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  train-test-containerize:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Upgrade pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # 4. Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 5. Train the User Behavior model
      - name: Train User Behavior Model
        run: python train_model.py

      # 6. Check model quality
      - name: Check ML Quality Gate
        run: python quality_gate.py

      # 7. Verify generated model files
      - name: Verify model artifacts
        run: |
          echo "Checking generated model files..."
          ls -lh *.pkl
          test -f user_behavior_model.pkl
          test -f label_encoders.pkl
          echo "Both model artifacts are available."

      # 8. Run automated tests
      - name: Run Automated Tests
        run: python -m unittest discover -v

      # 9. Build Docker image
      - name: Build Docker image
        run: docker build -t user-behavior-ml:${{ github.sha }} .

      # 10. Start Docker container
      - name: Start Docker container
        run: |
          docker run -d \
            --name user-behavior-container \
            -p 5000:5000 \
            user-behavior-ml:${{ github.sha }}

      # 11. Check application health
      - name: Wait for application to become ready
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Application is ready."
              exit 0
            fi

            echo "Waiting for application... attempt $i"
            sleep 2
          done

          echo "Application did not become ready."
          docker logs user-behavior-container
          exit 1

      # 12. Test prediction API
      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "Device Model": "Google Pixel 5",
              "Operating System": "Android",
              "App Usage Time (min/day)": 393,
              "Screen On Time (hours/day)": 6.4,
              "Battery Drain (mAh/day)": 1872,
              "Number of Apps Installed": 67,
              "Data Usage (MB/day)": 1122,
              "Age": 40,
              "Gender": "Male"
            }' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'

      # 13. Display Docker logs
      - name: Show Docker container logs
        if: always()
        run: docker logs user-behavior-container || true

      # 14. Remove Docker container
      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f user-behavior-container || true

      # 15. Login to GitHub Container Registry
      - name: Login to GHCR
        if: success() && github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      # 16. Tag the Docker image
      - name: Tag Docker image for GHCR
        if: success() && github.event_name != 'pull_request'
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          docker tag user-behavior-ml:${{ github.sha }} \
            ghcr.io/${IMAGE_NAME}:v1

          docker tag user-behavior-ml:${{ github.sha }} \
            ghcr.io/${IMAGE_NAME}:latest

      # 17. Publish versioned image
      - name: Push versioned image to GHCR
        if: success() && github.event_name != 'pull_request'
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker push ghcr.io/${IMAGE_NAME}:v1

      # 18. Publish latest image
      - name: Push latest image to GHCR
        if: success() && github.event_name != 'pull_request'
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker push ghcr.io/${IMAGE_NAME}:latest
